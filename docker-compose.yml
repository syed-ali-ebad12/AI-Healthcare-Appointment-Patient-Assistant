services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carely
      POSTGRES_USER: carely
      POSTGRES_PASSWORD: carely
    ports:
      - "5432:5432"
    volumes:
      - carely-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carely -d carely"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  carely-postgres:
